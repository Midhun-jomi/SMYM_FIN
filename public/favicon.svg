<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Emerald Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Coin Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glass & Shine Overlay -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35" />
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="url(#bgGradient)"
    filter="url(#dropShadow)"
  />

  <!-- Top Glass Sheen -->
  <path
    d="M 32 144 C 32 82 82 32 144 32 L 368 32 C 430 32 480 82 480 144 L 480 200 C 350 240 160 210 32 150 Z"
    fill="url(#shineGradient)"
    clip-path="url(#roundedClip)"
  />

  <!-- Subtle Border Ring -->
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="110"
    fill="none"
    stroke="#34D399"
    stroke-width="4"
    stroke-opacity="0.45"
  />

  <!-- Primary Graphic Group -->
  <g filter="url(#iconShadow)">
    <!-- Base Financial Coin Disc (Gold) -->
    <ellipse cx="256" cy="348" rx="136" ry="46" fill="#044e39" opacity="0.6" />
    <circle cx="256" cy="316" r="120" fill="url(#goldGradient)" />
    <circle cx="256" cy="316" r="102" fill="none" stroke="#FEF3C7" stroke-width="6" stroke-opacity="0.75" />
    
    <!-- Coin Inner Cutout / Accent Ring -->
    <circle cx="256" cy="316" r="88" fill="#059669" opacity="0.15" />

    <!-- Rupee / Financial Curve Accent Inside Coin -->
    <path
      d="M 216 280 L 296 280 M 216 298 L 276 298 M 216 280 C 265 285 265 330 216 338 L 284 372"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Christian Cross Symbol (Soaring atop with radiant rays) -->
    <!-- Vertical Beam -->
    <rect x="236" y="92" width="40" height="152" rx="10" fill="#FFFFFF" />
    <!-- Horizontal Cross Bar -->
    <rect x="176" y="142" width="160" height="38" rx="10" fill="#FFFFFF" />

    <!-- Golden Cross Core Gem -->
    <circle cx="256" cy="161" r="14" fill="url(#goldGradient)" />

    <!-- Upward Growth Arrow / Momentum Arc (Left to Right) -->
    <path
      d="M 120 340 C 150 250 230 190 380 180"
      fill="none"
      stroke="#FDE047"
      stroke-width="12"
      stroke-linecap="round"
      stroke-dasharray="8 8"
    />
    <polygon points="380,166 404,182 380,198" fill="#FDE047" />

    <!-- Four Radiant Dove / Cross Light Rays -->
    <circle cx="256" cy="72" r="7" fill="#FDE047" />
    <circle cx="152" cy="161" r="6" fill="#FDE047" />
    <circle cx="360" cy="161" r="6" fill="#FDE047" />
  </g>
</svg>
